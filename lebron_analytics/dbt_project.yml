name: 'lebron_analytics'
version: '1.0.0'
config-version: 2

# This setting configures which "profile" dbt uses for this project.
profile: 'lebron_analytics'

# These configurations specify where dbt should look for different types of files.
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# Model configurations
models:
  lebron_analytics:
    # Staging models - clean and standardize raw data
    staging:
      +materialized: view
      
    # Intermediate models - business logic transformations
    intermediate:
      +materialized: view
      
    # Marts - final analytics-ready models
    marts:
      +materialized: table

# Seeds configuration (for reference data like season dates)
seeds:
  lebron_analytics:
    +schema: seeds
    +alias: team_abbreviations